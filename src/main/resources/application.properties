spring.application.name=spring-ai-intro

#Pass API key as environment variable, e.g. -DOPENAI_API_KEY=your-api-key
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.google.genai.chat.options.model=gemini-3.5-flash
#spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Ollama Configuration
#langchain4j.ollama.chat-model.base-url=http://localhost:11434

# Change this line
#langchain4j.ollama.chat-model.base-url=http://127.0.0.1:11434
#langchain4j.ollama.chat-model.model-name=llama3.2
#langchain4j.ollama.chat-model.temperature=0.0

spring.ai.ollama.chat.options.model=llama3.2
# 1. Enforce strict JSON object output mode
spring.ai.ollama.chat.options.format=json
# 2. Lower the temperature so the model follows instructions rigidly instead of hallucinating schema files
spring.ai.ollama.chat.options.temperature=0.1
